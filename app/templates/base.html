<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FriendlyEats{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🍽️ FriendlyEats</a>
    <nav>
      <a href="/algoritmos" class="btn btn-ghost">Algoritmos de búsqueda</a>
      <a href="/restaurants/new" class="btn btn-primary">+ Nuevo restaurante</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Sprint 1 · FastAPI + Firestore (emulador) · <a href="/docs">API interactiva</a>
  </footer>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
